AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cold Start Latency Research Stack — Hybrid ML/DL Framework
  VPC vs Non-VPC | ZIP packages (small/medium/large) | Dynamic Provisioning
  Account: !Ref AWS::AccountId | Region: us-east-1

# ─────────────────────────────────────────────
#  PARAMETERS
# ─────────────────────────────────────────────
Parameters:
  ProjectName:
    Type: String
    Default: coldstart-research
  ProvisionedConcurrency:
    Type: Number
    Default: 2
    Description: Initial provisioned concurrency for the provisioned function

# ─────────────────────────────────────────────
#  RESOURCES
# ─────────────────────────────────────────────
Resources:

  # ── VPC ──────────────────────────────────────
  ResearchVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ResearchVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ResearchVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-1

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ResearchVPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: us-east-1a
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ResearchVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: us-east-1b
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-2

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ResearchVPC

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ResearchVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  DynamoDBVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ResearchVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC Lambda functions
      VpcId: !Ref ResearchVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-lambda-sg

  # ── DYNAMODB ──────────────────────────────────
  BooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-books
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: bookId
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: bookId
          AttributeType: S
        - AttributeName: genre
          AttributeType: S
        - AttributeName: publishedYear
          AttributeType: N
      GlobalSecondaryIndexes:
        - IndexName: genre-publishedYear-index
          KeySchema:
            - AttributeName: genre
              KeyType: HASH
            - AttributeName: publishedYear
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-metrics
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: functionType
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: functionType-index
          KeySchema:
            - AttributeName: functionType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── IAM ROLE ──────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt BooksTable.Arn
                  - !Sub ${BooksTable.Arn}/index/*
                  - !GetAtt MetricsTable.Arn
                  - !Sub ${MetricsTable.Arn}/index/*
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: LambdaConcurrencyManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:PutProvisionedConcurrencyConfig
                  - lambda:GetProvisionedConcurrencyConfig
                  - lambda:DeleteProvisionedConcurrencyConfig
                  - lambda:ListProvisionedConcurrencyConfigs
                  - lambda:GetAlias
                Resource: '*'

  # ── LOG GROUPS ────────────────────────────────
  LogGroupNonVpc:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/coldstart-research-api-non-vpc
      RetentionInDays: 14

  LogGroupVpc:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/coldstart-research-api-vpc
      RetentionInDays: 14

  LogGroupProvisioned:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/coldstart-research-api-provisioned
      RetentionInDays: 14

  LogGroupSmallPkg:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/coldstart-research-api-small-pkg
      RetentionInDays: 14

  LogGroupLargePkg:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/coldstart-research-api-large-pkg
      RetentionInDays: 14

  LogGroupSeeder:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/coldstart-research-seeder
      RetentionInDays: 7

  LogGroupDynamicProvisioner:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/coldstart-research-dynamic-provisioner
      RetentionInDays: 7

  # ── LAMBDA FUNCTION CODE (shared inline) ──────
  # Non-VPC baseline
  BookApiNonVpc:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupNonVpc
    Properties:
      FunctionName: coldstart-research-api-non-vpc
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 128
      Timeout: 30
      Description: "RESEARCH: Non-VPC baseline | package_size=small | dep_count=3"
      Layers:
        - arn:aws:lambda:us-east-1:580247275435:layer:LambdaInsightsExtension:38
      Environment:
        Variables:
          FUNCTION_TYPE: non-vpc
          BOOKS_TABLE: !Ref BooksTable
          METRICS_TABLE: !Ref MetricsTable
          PACKAGE_SIZE_KB: "48"
          DEP_COUNT: "3"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ColdStartVariant
          Value: non-vpc
      Code:
        ZipFile: |
          import json, os, time, uuid, boto3
          from datetime import datetime, timezone
          from decimal import Decimal
          import boto3.dynamodb.conditions as C

          dynamodb    = boto3.resource('dynamodb')
          books_tbl   = dynamodb.Table(os.environ['BOOKS_TABLE'])
          metrics_tbl = dynamodb.Table(os.environ['METRICS_TABLE'])
          FTYPE       = os.environ.get('FUNCTION_TYPE', 'unknown')
          PKG_KB      = int(os.environ.get('PACKAGE_SIZE_KB', 48))
          DEP_COUNT   = int(os.environ.get('DEP_COUNT', 3))
          COLD        = True

          class Dec(json.JSONEncoder):
              def default(self, o):
                  return float(o) if isinstance(o, Decimal) else super().default(o)

          def save_metric(req_id, path, method, ms, cold, init_ms=None):
              try:
                  item = {
                      'requestId':    req_id,
                      'functionType': FTYPE,
                      'path': path,   'method': method,
                      'durationMs':   Decimal(str(round(ms, 2))),
                      'isColdStart':  cold,
                      'memoryMB':     int(os.environ.get('AWS_LAMBDA_FUNCTION_MEMORY_SIZE', 128)),
                      'packageSizeKb': PKG_KB,
                      'depCount':     DEP_COUNT,
                      'timestamp':    datetime.now(timezone.utc).isoformat(),
                      'ttl':          int(time.time()) + 2592000
                  }
                  if init_ms is not None:
                      item['initDurationMs'] = Decimal(str(round(init_ms, 2)))
                  metrics_tbl.put_item(Item=item)
              except Exception as e:
                  print(f'[metric_err] {e}')

          def resp(code, body, cold, ms):
              return {
                  'statusCode': code,
                  'headers': {
                      'Content-Type':    'application/json',
                      'X-Cold-Start':    str(cold),
                      'X-Function-Type': FTYPE,
                      'X-Duration-Ms':   str(round(ms, 2))
                  },
                  'body': json.dumps(body, cls=Dec)
              }

          def handler(event, context):
              global COLD
              t0   = time.time()
              cold = COLD
              COLD = False
              path = event.get('path', '/')
              meth = event.get('httpMethod', 'GET')
              pp   = event.get('pathParameters') or {}
              qs   = event.get('queryStringParameters') or {}
              body = {}
              if event.get('body'):
                  try: body = json.loads(event['body'])
                  except: pass
              try:
                  if path == '/health':
                      r, c = {'status':'ok','fn':FTYPE,'cold':cold}, 200
                  elif path == '/books' and meth == 'GET':
                      g = qs.get('genre')
                      if g:
                          res = books_tbl.query(IndexName='genre-publishedYear-index',
                                                KeyConditionExpression=C.Key('genre').eq(g))
                      else:
                          res = books_tbl.scan(Limit=20)
                      r, c = {'books': res['Items'], 'count': len(res['Items'])}, 200
                  elif path == '/books' and meth == 'POST':
                      bid  = str(uuid.uuid4())
                      item = {**body, 'bookId': bid, 'createdAt': datetime.now(timezone.utc).isoformat()}
                      if 'publishedYear' in item: item['publishedYear'] = int(item['publishedYear'])
                      books_tbl.put_item(Item=item)
                      r, c = {'bookId': bid, 'message': 'created'}, 201
                  elif path.startswith('/books/') and meth == 'GET':
                      bid = pp.get('bookId', path.split('/')[-1])
                      res = books_tbl.get_item(Key={'bookId': bid})
                      r, c = (res['Item'], 200) if 'Item' in res else ({'error':'not found'}, 404)
                  elif path.startswith('/books/') and meth == 'PUT':
                      bid = pp.get('bookId', path.split('/')[-1])
                      upd = {k:v for k,v in body.items() if k != 'bookId'}
                      if upd:
                          expr  = 'SET ' + ', '.join(f'#k{i}=:v{i}' for i in range(len(upd)))
                          names = {f'#k{i}':k for i,k in enumerate(upd)}
                          vals  = {f':v{i}':v for i,v in enumerate(upd.values())}
                          books_tbl.update_item(Key={'bookId':bid},
                              UpdateExpression=expr,
                              ExpressionAttributeNames=names,
                              ExpressionAttributeValues=vals)
                          r, c = {'message':'updated','bookId':bid}, 200
                      else:
                          r, c = {'error':'nothing to update'}, 400
                  elif path.startswith('/books/') and meth == 'DELETE':
                      bid = pp.get('bookId', path.split('/')[-1])
                      books_tbl.delete_item(Key={'bookId': bid})
                      r, c = {'message':'deleted'}, 200
                  else:
                      r, c = {'error':'not found'}, 404
              except Exception as e:
                  r, c = {'error': str(e)}, 500
              ms = (time.time() - t0) * 1000
              save_metric(context.aws_request_id, path, meth, ms, cold)
              return resp(c, r, cold, ms)

  # VPC Lambda
