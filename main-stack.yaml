  # Dynamic Provisioner Lambda
  DynamicProvisioner:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupDynamicProvisioner
    Properties:
      FunctionName: coldstart-research-dynamic-provisioner
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 60
      Description: "RESEARCH: Dynamic provisioning — adjusts concurrency based on TFT traffic predictions"
      Environment:
        Variables:
          PROVISIONED_FUNCTION: coldstart-research-api-provisioned
          PROVISIONED_ALIAS: live
          MIN_CONCURRENCY: "1"
          MAX_CONCURRENCY: "10"
          METRICS_TABLE: !Ref MetricsTable
      Tags:
        - Key: Project
          Value: !Ref ProjectName
      Code:
        ZipFile: |
          import json, os, boto3, math
          from datetime import datetime, timezone

          lambda_client = boto3.client('lambda')
          dynamodb      = boto3.resource('dynamodb')
          metrics_tbl   = dynamodb.Table(os.environ['METRICS_TABLE'])

          FN_NAME   = os.environ['PROVISIONED_FUNCTION']
          ALIAS     = os.environ['PROVISIONED_ALIAS']
          MIN_PC    = int(os.environ.get('MIN_CONCURRENCY', 1))
          MAX_PC    = int(os.environ.get('MAX_CONCURRENCY', 10))

          def handler(event, context):
              """
              Called by EventBridge every 5 minutes or directly by dynamic_provisioning.py.
              event = {
                  "predicted_invocations": <int>,   # from TFT model
                  "hour_of_day": <int>,
                  "scaling_factor": <float>         # optional override
              }
              """
              predicted = event.get('predicted_invocations', 0)
              hour      = event.get('hour_of_day', datetime.now().hour)
              factor    = event.get('scaling_factor', 1.0)

              # Compute desired concurrency from prediction
              # Rule: 1 provisioned unit per 50 predicted invocations per 5 min window
              desired = max(MIN_PC, min(MAX_PC, math.ceil(predicted / 50 * factor)))

              # Get current setting
              try:
                  current_cfg = lambda_client.get_provisioned_concurrency_config(
                      FunctionName=FN_NAME, Qualifier=ALIAS)
                  current = current_cfg['RequestedProvisionedConcurrentExecutions']
              except Exception:
                  current = 0

              result = {
                  'timestamp':  datetime.now(timezone.utc).isoformat(),
                  'hour':       hour,
                  'predicted':  predicted,
                  'current_pc': current,
                  'desired_pc': desired,
                  'action':     'no_change'
              }

              # Only update if changed by more than 1 to avoid thrashing
              if abs(desired - current) > 1:
                  lambda_client.put_provisioned_concurrency_config(
                      FunctionName=FN_NAME,
                      Qualifier=ALIAS,
                      ProvisionedConcurrentExecutions=desired
                  )
                  result['action'] = f'scaled {"up" if desired > current else "down"}_to_{desired}'
                  print(f"[dynamic_provisioner] {result['action']} | predicted={predicted} | hour={hour}")

              # Log to DynamoDB for comparison vs AWS autoscaling
              try:
                  from decimal import Decimal
                  metrics_tbl.put_item(Item={
                      'requestId':    f"dyn-{context.aws_request_id}",
                      'functionType': 'dynamic-provisioner',
                      'path':         '/provisioner',
                      'method':       'INTERNAL',
                      'durationMs':   Decimal('0'),
                      'isColdStart':  False,
                      'memoryMB':     256,
                      'packageSizeKb': 0,
                      'depCount':     0,
                      'timestamp':    result['timestamp'],
                      'provisioningAction': result['action'],
                      'predictedInvocations': predicted,
                      'desiredConcurrency':   desired,
                      'ttl': __import__('time').time() + 2592000
                  })
              except Exception as e:
                  print(f'[metric_err] {e}')

              return result

  # DB Seeder Lambda
  DbSeeder:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupSeeder
    Properties:
      FunctionName: coldstart-research-seeder
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 120
      Description: "Seeds DynamoDB with 20 book records for realistic API testing"
      Environment:
        Variables:
          BOOKS_TABLE: !Ref BooksTable
      Tags:
        - Key: Project
          Value: !Ref ProjectName
      Code:
        ZipFile: |
          import os, uuid, boto3, random
          from datetime import datetime, timezone
          from decimal import Decimal

          dynamodb = boto3.resource('dynamodb')

          BOOKS = [
            {"title":"Clean Code","author":"Robert C. Martin","genre":"Technology","publishedYear":2008,"isbn":"978-0132350884","price":Decimal("35.99"),"stock":150,"rating":Decimal("4.7")},
            {"title":"The Pragmatic Programmer","author":"David Thomas","genre":"Technology","publishedYear":2019,"isbn":"978-0135957059","price":Decimal("49.95"),"stock":200,"rating":Decimal("4.8")},
            {"title":"Designing Data-Intensive Applications","author":"Martin Kleppmann","genre":"Technology","publishedYear":2017,"isbn":"978-1449373320","price":Decimal("55.00"),"stock":80,"rating":Decimal("4.9")},
            {"title":"System Design Interview","author":"Alex Xu","genre":"Technology","publishedYear":2020,"isbn":"979-8664653403","price":Decimal("35.99"),"stock":150,"rating":Decimal("4.7")},
            {"title":"Introduction to Algorithms","author":"Thomas H. Cormen","genre":"Technology","publishedYear":2009,"isbn":"978-0262033848","price":Decimal("89.99"),"stock":90,"rating":Decimal("4.6")},
            {"title":"Deep Learning","author":"Ian Goodfellow","genre":"Technology","publishedYear":2016,"isbn":"978-0262035613","price":Decimal("74.99"),"stock":70,"rating":Decimal("4.7")},
            {"title":"The Hitchhiker's Guide to the Galaxy","author":"Douglas Adams","genre":"Science Fiction","publishedYear":1979,"isbn":"978-0345391803","price":Decimal("12.99"),"stock":300,"rating":Decimal("4.6")},
            {"title":"Dune","author":"Frank Herbert","genre":"Science Fiction","publishedYear":1965,"isbn":"978-0441013593","price":Decimal("14.99"),"stock":250,"rating":Decimal("4.8")},
            {"title":"Sapiens","author":"Yuval Noah Harari","genre":"Non-Fiction","publishedYear":2011,"isbn":"978-0062316097","price":Decimal("18.00"),"stock":400,"rating":Decimal("4.7")},
            {"title":"Atomic Habits","author":"James Clear","genre":"Self-Help","publishedYear":2018,"isbn":"978-0735211292","price":Decimal("16.99"),"stock":500,"rating":Decimal("4.8")},
            {"title":"The Psychology of Money","author":"Morgan Housel","genre":"Finance","publishedYear":2020,"isbn":"978-0857197689","price":Decimal("19.99"),"stock":320,"rating":Decimal("4.8")},
            {"title":"Rich Dad Poor Dad","author":"Robert Kiyosaki","genre":"Finance","publishedYear":1997,"isbn":"978-1612680194","price":Decimal("14.99"),"stock":400,"rating":Decimal("4.5")},
            {"title":"The Great Gatsby","author":"F. Scott Fitzgerald","genre":"Classic","publishedYear":1925,"isbn":"978-0743273565","price":Decimal("10.99"),"stock":120,"rating":Decimal("4.3")},
            {"title":"1984","author":"George Orwell","genre":"Classic","publishedYear":1949,"isbn":"978-0451524935","price":Decimal("11.99"),"stock":350,"rating":Decimal("4.7")},
            {"title":"To Kill a Mockingbird","author":"Harper Lee","genre":"Classic","publishedYear":1960,"isbn":"978-0061935466","price":Decimal("13.99"),"stock":200,"rating":Decimal("4.8")},
            {"title":"The Alchemist","author":"Paulo Coelho","genre":"Fiction","publishedYear":1988,"isbn":"978-0062315007","price":Decimal("14.99"),"stock":280,"rating":Decimal("4.6")},
            {"title":"Harry Potter and the Sorcerer's Stone","author":"J.K. Rowling","genre":"Fantasy","publishedYear":1997,"isbn":"978-0439708180","price":Decimal("12.99"),"stock":600,"rating":Decimal("4.9")},
            {"title":"The Lord of the Rings","author":"J.R.R. Tolkien","genre":"Fantasy","publishedYear":1954,"isbn":"978-0618640157","price":Decimal("24.99"),"stock":300,"rating":Decimal("4.9")},
            {"title":"Brave New World","author":"Aldous Huxley","genre":"Classic","publishedYear":1932,"isbn":"978-0060850524","price":Decimal("10.99"),"stock":160,"rating":Decimal("4.4")},
            {"title":"The Lean Startup","author":"Eric Ries","genre":"Technology","publishedYear":2011,"isbn":"978-0307887894","price":Decimal("17.99"),"stock":220,"rating":Decimal("4.5")},
          ]

          def handler(event, context):
              table  = dynamodb.Table(os.environ['BOOKS_TABLE'])
              action = event.get('action', 'seed')
              TAGS   = ['bestseller','award-winner','classic','recommended','new-arrival']
              if action == 'clear':
                  scan = table.scan(ProjectionExpression='bookId')
                  with table.batch_writer() as b:
                      for item in scan['Items']:
                          b.delete_item(Key={'bookId': item['bookId']})
                  return {'message': f"Cleared {len(scan['Items'])} records"}
              with table.batch_writer() as b:
                  for book in BOOKS:
                      b.put_item(Item={
                          **book,
                          'bookId':    str(uuid.uuid4()),
                          'createdAt': datetime.now(timezone.utc).isoformat(),
                          'tags':      random.sample(TAGS, k=2)
                      })
              return {'message': f'Seeded {len(BOOKS)} books', 'status': 'success'}

  # ── API GATEWAY ───────────────────────────────
  ResearchApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: coldstart-research-api
      Description: !Sub "Book Inventory API — Cold Start Research (${AWS::AccountId} / ${AWS::Region})"
      EndpointConfiguration:
        Types:
          - REGIONAL

  BooksResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ResearchApi
      ParentId: !GetAtt ResearchApi.RootResourceId
      PathPart: books

  BookIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ResearchApi
      ParentId: !Ref BooksResource
      PathPart: "{bookId}"

  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ResearchApi
      ParentId: !GetAtt ResearchApi.RootResourceId
      PathPart: health

  BooksGET:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResearchApi
      ResourceId: !Ref BooksResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookApiNonVpc.Arn}/invocations

  BooksPOST:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResearchApi
      ResourceId: !Ref BooksResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookApiNonVpc.Arn}/invocations

  BookGET:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResearchApi
      ResourceId: !Ref BookIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookApiNonVpc.Arn}/invocations

  BookPUT:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResearchApi
      ResourceId: !Ref BookIdResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookApiNonVpc.Arn}/invocations

  BookDELETE:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResearchApi
      ResourceId: !Ref BookIdResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookApiNonVpc.Arn}/invocations

  HealthGET:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResearchApi
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookApiNonVpc.Arn}/invocations

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - BooksGET
      - BooksPOST
      - BookGET
      - BookPUT
      - BookDELETE
      - HealthGET
    Properties:
      RestApiId: !Ref ResearchApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ResearchApi
      DeploymentId: !Ref ApiDeployment
      StageName: dev
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          LoggingLevel: "OFF"

  # ── LAMBDA PERMISSIONS ───────────────────────
  PermNonVpc:
