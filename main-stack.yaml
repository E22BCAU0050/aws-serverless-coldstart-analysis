  ProvisionedVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref BookApiProvisioned
      Description: v1 - provisioned concurrency target

  ProvisionedAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref BookApiProvisioned
      FunctionVersion: !GetAtt ProvisionedVersion.Version
      Name: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: !Ref ProvisionedConcurrency

  # Small package variant (simulate low dep count)
  BookApiSmallPkg:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupSmallPkg
    Properties:
      FunctionName: coldstart-research-api-small-pkg
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 128
      Timeout: 30
      Description: "RESEARCH: Small package 32KB | dep_count=1 | package size ablation"
      Environment:
        Variables:
          FUNCTION_TYPE: small-pkg
          BOOKS_TABLE: !Ref BooksTable
          METRICS_TABLE: !Ref MetricsTable
          PACKAGE_SIZE_KB: "32"
          DEP_COUNT: "1"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ColdStartVariant
          Value: small-pkg
      Code:
        ZipFile: |
          import json, os, time, boto3
          from datetime import datetime, timezone
          from decimal import Decimal

          dynamodb    = boto3.resource('dynamodb')
          metrics_tbl = dynamodb.Table(os.environ['METRICS_TABLE'])
          FTYPE       = os.environ.get('FUNCTION_TYPE', 'small-pkg')
          PKG_KB      = int(os.environ.get('PACKAGE_SIZE_KB', 32))
          DEP_COUNT   = int(os.environ.get('DEP_COUNT', 1))
          COLD        = True

          class Dec(json.JSONEncoder):
              def default(self, o):
                  return float(o) if isinstance(o, Decimal) else super().default(o)

          def handler(event, context):
              global COLD
              t0 = time.time(); cold = COLD; COLD = False
              try:
                  metrics_tbl.put_item(Item={
                      'requestId':     context.aws_request_id,
                      'functionType':  FTYPE,
                      'path':          event.get('path', '/health'),
                      'method':        event.get('httpMethod', 'GET'),
                      'durationMs':    Decimal(str(round((time.time()-t0)*1000, 2))),
                      'isColdStart':   cold,
                      'memoryMB':      128,
                      'packageSizeKb': PKG_KB,
                      'depCount':      DEP_COUNT,
                      'timestamp':     datetime.now(timezone.utc).isoformat(),
                      'ttl':           int(time.time()) + 2592000
                  })
              except Exception as e:
                  print(f'[metric_err] {e}')
              ms = (time.time() - t0) * 1000
              return {
                  'statusCode': 200,
                  'headers': {'X-Cold-Start': str(cold), 'X-Function-Type': FTYPE, 'X-Duration-Ms': str(round(ms,2))},
                  'body': json.dumps({'status':'ok','fn':FTYPE,'cold':cold,'pkgKb':PKG_KB,'depCount':DEP_COUNT}, cls=Dec)
              }

